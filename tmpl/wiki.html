<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <partial src="partials/meta.htm"></partial>
    <link rel="preload" as="font" href="/fonts/Inter/Inter-upright-var.woff2" type="font/woff2" crossorigin="anonymous">
    <style>
    @font-face {
      font-family: 'Inter var';
      font-weight: 100 900;
      font-display: swap;
      font-style: normal;
      font-named-instance: 'Regular';
      src: url("/fonts/Inter/Inter-upright-var.woff2") format("woff2");
      font-display: swap;
    }
    @font-face {
      font-family: 'Inter var';
      font-weight: 100 900;
      font-display: swap;
      font-style: italic;
      font-named-instance: 'Italic';
      src: url("/fonts/Inter/Inter-italic-var.woff2") format("woff2");
      font-display: swap;
    }
    @font-face {
      font-family: 'Triunfo';
      font-style: normal;
      font-weight: 400;
      src: url("/fonts/Triunfo/Triunfo-Regular-Cond.otf") format("opentype");
      font-display: swap;
    }
    #article img {
      display: inline-block;
      max-width: 128px !important;
    }
    code {
      padding: 0;
      display: inline-block;
    }
    #modalWrap {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 99.9%;
      overflow: auto;
      background-color: rgba(0,0,0,0.1);
      opacity: 0;
      transform: scale(0.9, 0.9);
      transition: all 0.44s ease-in-out;
      z-index: -1;
    }
    #modalWrap.open {
      background-color: rgba(0,0,0,0.9);
      opacity: 1;
      transform: scale(.95, .95);
      z-index: 999;
    }
    #modalImg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
      max-height: 96% !important;
      max-width: 90%;
    }
    #modalClose {
      position: absolute;
      top: 10px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
    }
    #modalClose:hover, #modalClose:focus {
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }
    </style>
    <link href="/css/styles.css" rel="stylesheet">
  </head>
  <body class="flex flex-col {{ theme.body_bg }}">
    <partial src="partials/header.htm"></partial>
    <section class="flex mt-4 mb-6 px-6" style="flex:1 0 auto">
      <article id="article" class="ml-auto mr-auto h-entry {{ topic }}" style="width:80ch">
      {{ content }}
      </article>
    </section>
    {% if id !== 'index' %}
    <div id="modalWrap">
      <span id="modalClose">&times;</span>
      <img id="modalImg">
      <div id="caption"></div>
    </div>
    <script>
    function setupModal() {
        const modal = document.getElementById('modalWrap');
        const modalImg = document.getElementById('modalImg');
        const wheelEvent = 'onwheel' in modal ? 'wheel' : 'mousewheel';
        function preventDefault(ev) {
          ev.preventDefault();
        }
        function disableScroll() {
          window.addEventListener(wheelEvent, preventDefault, { passive: false });
          window.addEventListener('touchmove', preventDefault, { passive: false });
        }
        function enableScroll() {
          window.removeEventListener(wheelEvent, preventDefault, { passive: false });
          window.removeEventListener('touchmove', preventDefault, { passive: false });
        }
        function closeModal() {
          modal.classList.remove('open');
          enableScroll();
          modalImg.src = '';
        }
        modal.onclick = function (ev) {
          if (ev.target.tagName !== 'IMG') closeModal();
        };
        function calcID(elem) {
          return elem.currentSrc.split('/').slice(-1)[0].split('.')[0];
        }
        document.body.onkeydown = function (ev) {
          if (ev.key === 'Escape') closeModal();
          else if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
            let next = null;
            const img = document.getElementById(modalImg.getAttribute('data-id'));
            if (ev.key === 'ArrowRight') next = img.nextElementSibling;
            else next = img.previousElementSibling;
            if (!next) return;
            modalImg.src = next.currentSrc;
            next.setAttribute('id', calcID(next));
            modalImg.setAttribute('data-id', next.id);
          }
        };
        document.getElementById('article').onclick = function (ev) {
          const tgt = ev.target;
          if (tgt.tagName !== 'IMG') {
            return;
          }
          modalImg.src = tgt.currentSrc;
          tgt.setAttribute('id', calcID(tgt));
          modalImg.setAttribute('data-id', tgt.id);
          modal.classList.add('open');
          disableScroll();
        };
    }
    window.addEventListener('load', function () {
      setupModal();
    });
    </script>
    {% endif %}
    <partial src="partials/footer.htm"></partial>
    <noscript><img src="{{ blog.analytics_url }}/pixel.gif"></noscript>
    <script src="{{ blog.analytics_url }}/script.js" defer></script>
  </body>
</html>
