<title>{{ title }} - {{ blog.name }}</title>
<meta name="google-site-verification" content="Qtb666uzTeXTjf9Kxstu3zoTNNE0CGkLhK2Ra-oYPtc" />

{% if blog.author %}
<meta name="author" content="{{ blog.author.name }}">
<link rel="author" href="{{ blog.author.url }}">
{% endif %}
<link rel="canonical" href="{{ blog.url }}{{ url }}" />
<link rel="publisher" href="{{ blog.url }}">

<!-- Favicons -->
<link rel="shortcut icon" href="/logo/favicon.ico" />
<link rel="apple-touch-icon" sizes="114x114" href="/logo/favicon-114-precomposed.png">
<link rel="apple-touch-icon" sizes="120x120" href="/logo/favicon-120-precomposed.png">
<link rel="apple-touch-icon" sizes="72x72" href="/logo/favicon-72-precomposed.png">
<link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="/logo/favicon.ico">

<!-- Open Graph meta -->
<meta property="og:locale" content="en_GB" />
<meta property="og:title" content="{{ title }} - {{ blog.name }}" />
<meta property="og:url" content="{{ blog.url }}{{ url }}" />
<meta property="og:site_name" content="{{ blog.name }}">

{% if layout === 'post' %}
  <meta property="og:type" content="article" />
  <link rel="webmention" href="https://webmention.io/crlf.link_author_/webmention" />
  <link rel="pingback" href="https://webmention.io/crlf.link_author_/xmlrpc" />
{% elif layout === 'wiki' %}
  <meta property="og:type" content="wiki" />
  <link rel="webmention" href="https://webmention.io/crlf.link_author_/webmention" />
  <link rel="pingback" href="https://webmention.io/crlf.link_author_/xmlrpc" />
{% elif url === 'author.html' %}
  <meta property="og:type" content="profile" />
  <link rel="pgpkey" href="/gpg/pubkey.asc" />
{% else %}
  <meta property="og:type" content="website" />
{% endif %}

{% if description %}
  <meta name="description" content="{{ description }}" />
{% endif %}
